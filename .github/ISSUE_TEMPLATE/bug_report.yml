      placeholder: e.g., local dev, Vercel, Netlify, Docker
    validations:
      required: true

  - type: input
    id: next-version
    attributes:
      label: Next.js Version
      description: Which version of Next.js are you using?
      placeholder: e.g., 15.3.0
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: What is the bug? Be as detailed as possible.
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to reproduce the issue.
      placeholder: |
        1. Go to page '...'
        2. Click on '...'
        3. Scroll to '...'
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: Describe what really happened.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Upload any screenshots, videos, or console logs that help explain the issue.
      placeholder: Drag and drop images or paste logs here.

  - type: input
    id: browser
    attributes:
      label: Browser / Device
      description: What browser/device did you use?
      placeholder: e.g., Chrome 123.0, iPhone 13, macOS Ventura
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      description: Please confirm before submitting
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have filled out all the required fields
          required: true

