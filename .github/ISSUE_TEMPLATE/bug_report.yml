name: Bug Report
description: File a bug report
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug in detail.
      placeholder: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the software?
      placeholder: e.g., 1.2.3
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
    validations:
      required: false
