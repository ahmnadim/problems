name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the Next.js frontend app
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible so we can investigate and fix it quickly.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where are you running the app?
      placeholder: e.g., local dev, Vercel, Netlify, Docker
    validations:
      required: true

  - type: input
    id: next-version
    attributes:
      label: Next.js Version
      description: Which version of Next.js are you using?
      placeholder: e.g., name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the Next.js frontend app
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible so we can investigate and fix it quickly.

  - type: input
    id: environment
