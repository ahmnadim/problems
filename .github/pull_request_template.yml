name: 🚀 Pull Request
description: Submit a new pull request to improve the project
title: "[PR]: "
labels: ["pull request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your contribution! Please fill out the details below to help us review your pull request effectively.

  - type: input
    id: pr-type
    attributes:
      label: Type of Change
      description: What kind of change does this PR introduce?
      placeholder: e.g., Feature, Bugfix, Refactor, Docs, Test
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe what this PR does.
      placeholder: Describe the purpose and changes introduced in this PR.
    validations:
      required: true

  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Link any related issues using `#issue-number`.
      placeholder: e.g., Closes #42, Fixes #101
    validations:
      required: false

  - type: textarea
    id: testing
    attributes:
      label: Test Plan
      description: How did you test this PR? Include test steps or screenshots.
      placeholder: |
        1. Navigate to page X
        2. Click button Y
        3. Confirm result Z
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please verify the following before submitting.
      options:
        - label: I have followed the code style and linting rules
          required: true
        - label: I have tested the changes locally
          required: true
        - label: I have added necessary documentation (if applicable)
          required: false
        - label: I have added tests that prove my fix is effective or that my feature works
          required: false
        - label: I have linked related issues (if any)
          required: false
